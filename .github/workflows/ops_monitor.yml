name: Ops Monitor

# Weekdays 10:45 and 17:30 ET: are the jobs running, their outputs fresh, the
# model account alive, the shared files on contract and every commit in its
# lane (ops_monitor.py, scope_audit.py)? Then why each closed trade won or lost
# vs the backtest (trade_attribution.py). Red opens an issue. No orders.

on:
  workflow_dispatch:

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read          # to read run history
      issues: write          # to read open issues and open a failure issue

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300   # the scope audit reads the last two days of commits

      - uses: actions/checkout@v4
        with:
          ref: history
          path: .history
        continue-on-error: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trade attribution
        continue-on-error: true
        run: python trade_attribution.py --history .history

      - name: Ops checks
        id: ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops_monitor.py --no-fail

      - name: Commit status
        if: always()
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/ops_status.json 2>/dev/null || true
          git add docs/data/trade_attribution.json 2>/dev/null || true
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Ops monitor [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      - name: Fail on red
        run: |
          python -c "import json,sys; s=json.load(open('docs/data/ops_status.json')); print('Ops status:', s['status'], s['red']); sys.exit(1 if s['status']=='red' else 0)"

      # One issue per day; later failures the same day are added as comments.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 Ops monitor red $(date -u +%Y-%m-%d)"
          body="$(python -c "import json; s=json.load(open('docs/data/ops_status.json')); print('\n'.join(f\"- **{c['name']}** ({c['status']}): {c['detail']}\" for c in s['checks'] if c['status']!='green'))" 2>/dev/null || echo 'see run log')"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "${body}"$'\n\n'"Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "${body}"$'\n\n'"Run log: ${RUN_URL}"
          fi
