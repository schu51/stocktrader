name: History and Graph

# Weekdays 18:45 ET, after the day's last write:
#  1. rebuild the knowledge graph (ontology.py -> docs/data/graph.json on main)
#  2. add every new version of the shared data files to the point-in-time
#     history (pit.py -> the `history` branch), known at its commit time
# Started by dispatcher.yml. Reads and records only; places no orders.

on:
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write          # to open a failure issue

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # versions are read from main's history

      - uses: actions/checkout@v4
        with:
          ref: history
          path: .history

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the knowledge graph
        run: python ontology.py

      - name: Commit graph
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/graph.json
          git diff --staged --quiet && { echo "Graph unchanged"; exit 0; }
          git commit -m "Knowledge graph update [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      - name: Add new versions to the history
        run: python pit.py --update --store .history

      - name: Commit history
        working-directory: .history
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add -A
          git diff --staged --quiet && { echo "No new versions"; exit 0; }
          git commit -m "History $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:history

      # In-workflow alert: runs started by the dispatcher belong to the Actions
      # bot, which neither emails anyone nor triggers a workflow_run listener.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 ${GITHUB_WORKFLOW} run failed $(date -u +%Y-%m-%d)" \
            --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
