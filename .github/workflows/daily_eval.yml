name: Daily Eval
# Weekdays 16:45 ET, after the post-market reconcile: live scorecard, a
# three-year backtest of the live rules against the challengers in
# research/challengers.json, and live-vs-backtest tracking (daily_eval.py).
# Read by the evening Claude review. Places no orders, changes no rules.
# Started by dispatcher.yml — timetable in dispatcher.py.

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write          # to open a failure issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Earnings dates change slowly: keep them between runs
      - uses: actions/cache@v4
        with:
          path: trading_data/backtest_cache/earnings_dates.json
          key: earnings-dates-${{ github.run_id }}
          restore-keys: earnings-dates-

      - name: Evaluate
        run: python daily_eval.py

      # Every shared file against its contract (contracts.py): a renamed or missing
      # field anywhere in docs/data fails this step, which opens an issue below.
      - name: Check data contracts
        if: always()
        run: python contracts.py --check

      - name: Commit eval
        if: always()
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/eval_latest.json docs/data/eval_history.json docs/data/eval_report.md 2>/dev/null || true
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Daily eval [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 ${GITHUB_WORKFLOW} failed $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
          fi
