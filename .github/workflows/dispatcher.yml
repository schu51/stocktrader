name: Dispatcher

# Triggered every 15 minutes by cron-job.org (GitHub's own schedule cron runs
# hours late). Starts whichever workflows are due — timetable in dispatcher.py.

on:
  workflow_dispatch:
    inputs:
      now:
        description: 'Preview only: print what would be due at this ISO timestamp, start nothing'
        required: false
      dry_run:
        description: 'Only print what is due, start nothing'
        type: boolean
        default: false
      selftest:
        description: 'Start only the Learning Agent (places no orders) to prove dispatch works'
        type: boolean
        default: false

# One dispatcher at a time, so the once-per-slot check in dispatcher.py cannot race.
concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write          # needed to start the other workflows
      issues: write           # to open a failure issue

    steps:
      - uses: actions/checkout@v4

      - name: Start due workflows
        env:
          GH_TOKEN: ${{ github.token }}
          NOW_INPUT: ${{ inputs.now }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          # Use the time this run was triggered, not when the runner started,
          # so a slow runner still lands in the slot cron-job.org fired for.
          # A supplied timestamp is preview-only: real runs always use the true time,
          # so a caller cannot make the dispatcher trade as if it were another time.
          if [ "$SELFTEST" = "true" ]; then
            python3 dispatcher.py --selftest
          elif [ -n "$NOW_INPUT" ]; then
            python3 dispatcher.py --now "$NOW_INPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            python3 dispatcher.py
          else
            python3 dispatcher.py --run --at "$(gh run view "$GITHUB_RUN_ID" --json createdAt -q .createdAt)"
          fi

      # Runs started by the dispatcher belong to the Actions bot, which emails no
      # one. One issue per day; later failures the same day are added as comments.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 ${GITHUB_WORKFLOW} failed $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
          fi
