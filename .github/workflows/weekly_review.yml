name: Weekly Review

# Posts one summary issue each Saturday: account, trades, what the learning
# agent decided, candidate evidence, live macro theses, and anything that broke.
# Started by dispatcher.yml after the other Saturday jobs.

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # to list failed runs
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and post the review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)
          gh run list --status failure --created ">=$SINCE" --limit 50 --json name,createdAt > failed_runs.json || echo "[]" > failed_runs.json
          python3 weekly_review.py --failed-runs failed_runs.json --body-file review.md --title-file title.txt
          gh issue create --title "$(cat title.txt)" --body-file review.md

      # In-workflow alert: runs started by the dispatcher belong to the Actions
      # bot, which neither emails anyone nor triggers a workflow_run listener.
      # Without this the review failed silently on 2026-10-10.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 ${GITHUB_WORKFLOW} run failed $(date -u +%Y-%m-%d)" \
            --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
