name: Portfolio Sync

on:
  workflow_dispatch:   # started by dispatcher.yml — timetable in dispatcher.py

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write          # to open a failure issue
    # Credentials at job level so every step inherits them
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify credentials are available
        run: |
          echo "ALPACA_API_KEY set: $( [ -n "$ALPACA_API_KEY" ] && echo YES || echo NO )"
          echo "ALPACA_SECRET_KEY set: $( [ -n "$ALPACA_SECRET_KEY" ] && echo YES || echo NO )"
          echo "ALPACA_PAPER: $ALPACA_PAPER"

      - name: Sync portfolio from Alpaca
        run: python portfolio_sync.py

      - name: Commit and push
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/latest.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Portfolio sync [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      # Runs started by the dispatcher belong to the Actions bot, which emails no
      # one. One issue per day; later failures the same day are added as comments.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 ${GITHUB_WORKFLOW} failed $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
          fi
