name: Overnight Shadow

# Weekdays 16:30 ET: the overnight shadow test (overnight_shadow.py). Settles
# last night's shadow holdings at this morning's open and records tonight's
# at today's close, from Alpaca SIP bars and quotes. Places no orders and
# reads only positions. Started by dispatcher.yml — timetable in dispatcher.py.

on:
  workflow_dispatch:

# One at a time: two runs could both settle or record the same night
concurrency:
  group: overnight-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write          # to open a failure issue
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Settle and record
        run: python overnight_shadow.py

      - name: Commit result
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/overnight_shadow.json
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Overnight shadow [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      # Runs started by the dispatcher belong to the Actions bot, which emails no
      # one. One issue per day; later failures the same day are added as comments.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 ${GITHUB_WORKFLOW} failed $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
          fi
