name: Swing Post Study

# One-off research (2026-11-12): the rules from a r/swingtrading write-up,
# replayed against the live momentum rules over three years
# (swing_post_study.py). Runs when the study branch is pushed, or on demand.
# Places no orders, changes no rules. Commits research/swing_post_study.{json,md}
# to the branch it ran on.

on:
  workflow_dispatch:
  push:
    branches: [swing-post-study]
    paths: [swing_post_study.py, backtest.py, technical_signals.py, .github/workflows/swing_post_study.yml]

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write          # to open a failure issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: trading_data/backtest_cache/earnings_dates.json
          key: earnings-dates-${{ github.run_id }}
          restore-keys: earnings-dates-

      - name: Study
        run: python swing_post_study.py --workers 4

      - name: Commit result
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add research/swing_post_study.json research/swing_post_study.md
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Swing post study results [skip ci]"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0
            sleep 5
          done
          exit 1

      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🚨 ${GITHUB_WORKFLOW} failed $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again. Run log: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
          fi
