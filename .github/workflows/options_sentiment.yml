name: Options Sentiment

# Weekdays 16:15 ET: after-close option chains for holdings, candidates, the
# big-mover watch list and a random control sample; forward returns filled in
# for past snapshots (options_sentiment.py). Measured only, places no orders.
# Started by dispatcher.yml — timetable in dispatcher.py.

on:
  workflow_dispatch:

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write          # to open a failure issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot option chains and score the evidence
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        run: python options_sentiment.py

      - name: Commit results
        if: always()
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/options_sentiment.json docs/data/options/ 2>/dev/null || true
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Options sentiment update [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      # In-workflow alert: runs started by the dispatcher belong to the Actions
      # bot, which neither emails anyone nor triggers a workflow_run listener.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 ${GITHUB_WORKFLOW} run failed $(date -u +%Y-%m-%d)" \
            --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
