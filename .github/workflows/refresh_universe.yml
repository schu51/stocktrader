name: Refresh Screener Universe
# Saturday 7:00 ET: rewrite docs/data/universe.json (the whole liquid US market,
# about 1,000 stocks trading $50M+/day, with sectors) that the screener scans every morning. A failed fetch leaves last
# week's file in place. Started by dispatcher.yml — timetable in dispatcher.py.

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write          # to open a failure issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh universe
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}       # asset list + a year of bars for the liquidity rules
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        run: python refresh_universe.py

      # Stable security ids (Alpaca asset id + SEC CIK) with ticker history (identity.py).
      # A failure here leaves the old registry in place and does not block the universe.
      - name: Refresh security registry
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        run: python identity.py --refresh

      - name: Commit universe
        run: |
          git config user.email "aschumacherdesign@gmail.com"
          git config user.name "schu51"
          git add docs/data/universe.json
          git add docs/data/securities.json 2>/dev/null || true
          git diff --staged --quiet && { echo "Universe unchanged"; exit 0; }
          git commit -m "Refresh screener universe [skip ci]"
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
            echo "push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = "1" ] || { echo "::error::push failed after 5 attempts"; exit 1; }

      # In-workflow alert: runs started by the dispatcher belong to the Actions
      # bot, which neither emails anyone nor triggers a workflow_run listener.
      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 ${GITHUB_WORKFLOW} run failed $(date -u +%Y-%m-%d)" \
            --body "The ${GITHUB_WORKFLOW} workflow failed. Run log: ${RUN_URL}"
